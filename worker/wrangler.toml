name = "xfit-ai-proxy"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "xfit-723dd"
# Gemini API model used by the proxy. Must exist for the project's API key.
GEMINI_MODEL = "gemini-3.5-flash"
# Comma-separated site origins allowed to call this Worker.
# For local development, temporarily add http://localhost:5173 in the Cloudflare
# dashboard (or a local `wrangler dev --var` override) — never commit it here.
ALLOWED_ORIGINS = "https://xfit-bpe.pages.dev,https://xfit-723dd.web.app"
# GEMINI_MODEL = "gemini-2.0-flash"

# Secret (NOT stored in this file) — set with:  npx wrangler secret put GEMINI_API_KEY
# Uttar AI is included free with every account. The only limit is the best-effort
# abuse guard in index.js (10 requests/min per user); no KV or billing is required.
