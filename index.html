    <!-- Resolve the saved wallpaper before the first paint. Kept inline so the
         page never flashes and the browser does not wait on an extra script
         request. public/_headers carries the matching CSP sha256 hash. -->
    <script>
(function () {
  var KEY = 'xfit-theme';
  var PREVIEW_KEY = 'xfit-public-wallpaper';
  var saved = null;
  var preview = null;
  try {
    saved = localStorage.getItem(KEY);
  } catch (error) {
    /* private mode */
  }
  try {
    preview = sessionStorage.getItem(PREVIEW_KEY);
  } catch (error) {
    /* private mode */
  }
  // Legacy values migrate once. Auto is a real preference now and is kept.
  // This mirrors theme.js exactly, including its cosmic default for new users.
  var migrated = saved === 'midnight' ? 'cosmic'
    : saved === 'sunrise' ? 'alabaster'
    : (saved === 'cosmic' || saved === 'alabaster' || saved === 'auto') ? saved
    : 'cosmic';
  try {
    if (saved !== migrated) localStorage.setItem(KEY, migrated);
  } catch (error) {
    /* private mode */
  }
  // Auto only resolves to one of the two static wallpapers: Light from 7am to
  // 7pm, Dark otherwise. Login stays Alabaster; the landing and demo pages
  // follow the shared session preview instead of the saved account preference.
  var hour = new Date().getHours();
  var autoWallpaper = hour >= 7 && hour < 19 ? 'alabaster' : 'cosmic';
  function resolve(value) {
    if (value === 'auto') return autoWallpaper;
    return value === 'cosmic' ? 'cosmic' : 'alabaster';
  }
  var path = location.pathname.replace(/\/+$/, '') || '/';
  var isDemoPage = path === '/' || path === '/demo';
  var mode = path === '/login' ? 'alabaster'
    : isDemoPage ? (preview ? resolve(preview) : 'alabaster')
    : resolve(migrated);

  var root = document.documentElement;
  root.classList.remove('theme-cosmic', 'theme-alabaster', 'theme-gradient', 'theme-midnight', 'theme-sunrise');
  root.classList.add('theme-' + mode);
  root.setAttribute('data-theme', mode);
  root.setAttribute('data-theme-mode', migrated);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    meta.setAttribute('content', mode === 'alabaster' ? '#ffffff' : '#000000');
  }
})();
    </script>

    <!-- Critical boot styles: keep the first paint branded even before the CSS bundle loads. -->
    <style>
      :root {
        --boot-page: #000;
        --boot-text: #9e9e9e;
        --boot-heading: #fff;
        --boot-tile: #000;
        --boot-mark: #fff;
      }
      html.theme-alabaster {
        --boot-page: #fff;
        --boot-text: #666;
        --boot-heading: #000;
        --boot-tile: #fff;
        --boot-mark: #000;
      }
      html { background: var(--boot-page); }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-page);
        color: var(--boot-text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #boot .boot-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        width: 100%;
        max-width: 384px;
        box-sizing: border-box;
        padding: 0 24px;
        text-align: center;
      }
      #boot .boot-copy { width: 100%; }
      #boot .boot-tile {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
        border-radius: 32px;
        background: var(--boot-tile);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(128, 128, 128, 0.25);
      }
      #boot .boot-emblem {
        position: relative;
        display: block;
        width: 64px;
        aspect-ratio: 384 / 136;
      }
      #boot .boot-frame,
      #boot .boot-u {
        position: absolute;
        background: var(--boot-mark);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      #boot .boot-frame {
        inset: 0;
        -webkit-mask-image: url('/icons/emblem-frame.webp');
        mask-image: url('/icons/emblem-frame.webp');
      }
      #boot .boot-u {
        left: 28.646%;
        top: 16.176%;
        width: 42.708%;
        height: 71.324%;
        -webkit-mask-image: url('/icons/emblem-u.webp');
        mask-image: url('/icons/emblem-u.webp');
        animation: boot-u-spin 1.5s linear infinite;
      }
      @keyframes boot-u-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-u { animation-duration: 3.2s; }
      }
      #boot .boot-heading {
        margin: 0;
        font-size: 2.5rem;
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: -0.025em;
        color: var(--boot-heading);
      }
      #boot .boot-tagline { margin: 8px 0 0; font-size: 1rem; }
      #boot .boot-label { font-size: 13px; color: var(--boot-text); }
    </style>

    <!-- Module scripts defer automatically; starting the fetch in the head
         removes the body-parsing wait without blocking the first paint. -->
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <!-- Static shell in the delivered HTML. It sits beside #root so React can
         mount without destroying the already-painted first frame; main.jsx
         hides it once the app has committed. -->
    <div id="boot" role="status" aria-live="polite" aria-label="Loading Uttar Fitness">
      <div class="boot-hero">
        <span class="boot-tile" aria-hidden="true">
          <span class="boot-emblem">
            <span class="boot-frame"></span>
            <span class="boot-u"></span>
          </span>
        </span>
        <div class="boot-copy">
          <div class="boot-heading">Uttar Fitness</div>
          <p class="boot-tagline">Direct Your Greatness, Live Uttar</p>
        </div>
        <span class="boot-label">Loading Uttar Fitness&hellip;</span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
        <strong>Uttar Fitness needs JavaScript.</strong>
        <p>Please enable JavaScript in your browser to use the workout tracker.</p>
      </div>
    </noscript>
  </body>
</html>
