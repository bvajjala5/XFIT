<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Uttar Fitness</title>
    <meta name="description" content="Uttar Fitness is an AI-powered fitness tracker for workouts, weekly training plans, nutrition, health metrics, and progress. Build your best self." />
    <meta name="application-name" content="Uttar Fitness" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Uttar Fitness" />
    <meta property="og:description" content="Track workouts, build AI-powered training plans, log nutrition and health metrics, and follow your fitness progress." />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="apple-mobile-web-app-title" content="Uttar Fitness" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#20212d" />

    <!-- Resolve the saved theme before the first paint (same-origin, CSP-safe). -->
    <script src="/theme-boot.js"></script>

    <!-- Critical boot styles: keep the first paint branded even before the CSS bundle loads. -->
    <style>
      :root {
        --boot-page: #20212d;
        --boot-text: #a0a8b8;
        --boot-tile: #000;
        --boot-mark: #fff;
      }
      html.theme-sunrise {
        --boot-page: #fbf6ef;
        --boot-text: #78716c;
        --boot-tile: #fff;
        --boot-mark: #000;
      }
      html { background: var(--boot-page); }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--boot-page);
        color: var(--boot-text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #boot .boot-tile {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: var(--boot-tile);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(128, 128, 128, 0.25);
      }
      #boot .boot-emblem {
        position: relative;
        display: block;
        width: 44px;
        aspect-ratio: 384 / 136;
      }
      #boot .boot-frame,
      #boot .boot-u {
        position: absolute;
        background: var(--boot-mark);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      #boot .boot-frame {
        inset: 0;
        -webkit-mask-image: url('/icons/emblem-frame.png');
        mask-image: url('/icons/emblem-frame.png');
      }
      #boot .boot-u {
        left: 28.646%;
        top: 16.176%;
        width: 42.708%;
        height: 71.324%;
        -webkit-mask-image: url('/icons/emblem-u.png');
        mask-image: url('/icons/emblem-u.png');
        animation: boot-u-spin 1.5s linear infinite;
      }
      @keyframes boot-u-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-u { animation-duration: 3.2s; }
      }
      #boot .boot-label { font-size: 14px; color: var(--boot-text); }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static shell in the delivered HTML; replaced as soon as React mounts. -->
      <div id="boot" role="status" aria-live="polite" aria-label="Loading Uttar Fitness">
        <span class="boot-tile" aria-hidden="true">
          <span class="boot-emblem">
            <span class="boot-frame"></span>
            <span class="boot-u"></span>
          </span>
        </span>
        <span class="boot-label">Loading Uttar Fitness&hellip;</span>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
        <strong>Uttar Fitness needs JavaScript.</strong>
        <p>Please enable JavaScript in your browser to use the workout tracker.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
