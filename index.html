<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>XFit | AI Workout &amp; Fitness Tracker</title>
    <meta name="description" content="XFit is an AI-powered fitness tracker for workouts, weekly training plans, nutrition, health metrics, and progress. Build your best self." />
    <meta name="application-name" content="XFit" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="XFit | AI Workout &amp; Fitness Tracker" />
    <meta property="og:description" content="Track workouts, build AI-powered training plans, log nutrition and health metrics, and follow your fitness progress." />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="apple-mobile-web-app-title" content="XFit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#20212d" />

    <!-- Critical boot styles: keep the first paint branded even before the CSS bundle loads. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #20212d;
        color: #eef2f7;
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #boot img { width: 64px; height: 64px; border-radius: 16px; }
      #boot span { font-size: 14px; color: #a0a8b8; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static shell in the delivered HTML; replaced as soon as React mounts. -->
      <div id="boot" role="status" aria-live="polite" aria-label="Loading XFit">
        <img src="/icons/icon-192.png" alt="" width="64" height="64" />
        <span>Loading XFit&hellip;</span>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
        <strong>XFit needs JavaScript.</strong>
        <p>Please enable JavaScript in your browser to use the workout tracker.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
